name: Vercel Services

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-services-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service-routing:
    name: Multi-service routing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Test services through Vercel dev
        run: pnpm test:vercel
